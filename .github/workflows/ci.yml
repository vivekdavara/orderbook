name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux, GCC 14
            os: ubuntu-24.04
            cxx: g++-14
          - name: Linux, Clang 18
            os: ubuntu-24.04
            cxx: clang++-18
          - name: macOS, Apple Clang
            os: macos-15
            cxx: clang++
    env:
      CXX: ${{ matrix.cxx }}
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v7
      - name: Install Ninja
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -q && sudo apt-get install -y -q ninja-build
          else
            brew install ninja
          fi
          "$CXX" --version
      - name: Debug build, warnings as errors
        run: |
          cmake --preset dev
          cmake --build --preset dev -j 4
      - name: Test (Debug)
        run: ctest --preset dev -j 4
      - name: Release build
        run: |
          cmake --preset release
          cmake --build --preset release -j 4
      - name: Test (Release)
        run: ctest --preset release -j 4
      - name: Run the benchmarks briefly (a smoke test; the numbers aren't used)
        run: ./build/release/bench/orderbook_bench --benchmark_min_time=0.01s

  sanitizers:
    name: Linux, Clang 18, ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v7
      - name: Install Ninja
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build
      - name: Build and test under the sanitizers
        run: make asan JOBS=4

  fuzz:
    name: Linux, Clang 18, libFuzzer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v7
      - name: Install Ninja
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build
      - name: Build the fuzz targets (ASan and UBSan)
        run: |
          cmake --preset fuzz
          cmake --build --preset fuzz -j 4
      - name: Fuzz the text format for 60 s, starting from the scenario files
        run: |
          mkdir -p corpus/text fuzz-artifacts
          cp tests/scenarios/*.txt corpus/text/
          ./build/fuzz/fuzz/text_fuzz -max_total_time=60 -timeout=10 -artifact_prefix=fuzz-artifacts/text- corpus/text
      - name: Fuzz the book for 60 s
        run: |
          mkdir -p corpus/book fuzz-artifacts
          ./build/fuzz/fuzz/book_fuzz -max_total_time=60 -timeout=10 -max_len=3000 \
            -artifact_prefix=fuzz-artifacts/book- corpus/book
      - name: Keep the inputs that crashed or timed out, to replay them
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings
          path: fuzz-artifacts/
          if-no-files-found: ignore
